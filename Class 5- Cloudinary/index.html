<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload an image | Cloudinary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <form class="upload-form" aria-labelledby="upload-heading">
        <div class="form-header">
          <h1 id="upload-heading">Upload an image</h1>
          <p>Choose an image to upload to Cloudinary.</p>
        </div>

        <button type="button" id="upload_widget">Upload Image</button>
      </form>
    </main>

    <script
      src="https://upload-widget.cloudinary.com/latest/global/all.js"
      type="text/javascript"
    ></script>

    <script src="app.js"></script>
  </body>
</html>
